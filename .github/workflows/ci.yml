name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the locked dependency graph
        run: cargo check --locked
      - name: Run unit tests
        run: cargo test --locked
      - name: Check generated Bash completion syntax
        shell: bash
        run: |
          set -euo pipefail
          target/debug/llm_cli completions bash | bash -n

  minimum-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Check the declared minimum Rust version
        run: cargo check --locked
