# Default configuration for llm-cli. Copy to .llm-cli/config.toml or pass with --config.
# All files are stored in .llm-cli/ directory in your project by default.

model = "llama3"
system_prompt = "Reply in concise bullets. Use short sentences. Break lines for each bullet. Be direct."
llm_timeout_secs = 45
cmd_timeout_secs = 60
max_context_tokens = 4096
streaming = true
request_timeout_secs = 60
generate_commit_message = true

# Embedding model for semantic intent matching (Tier 2)
embedding_model = "nomic-embed-text"

# Small LLM model for intent classification fallback (Tier 3)
# Recommended: qwen2:0.5b (fast), qwen2:1.5b (better), or phi3:mini (best accuracy)
classifier_model = "qwen2:1.5b"

# Optional: set custom file paths (all default to .llm-cli/ directory)
# history_path = ".llm-cli/history.jsonl"
# embedding_cache_path = ".llm-cli/embeddings.toml"
# learned_path = ".llm-cli/learned.toml"
