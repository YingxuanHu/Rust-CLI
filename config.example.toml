# Default configuration for llm-cli. Copy to config dir or pass with --config.

model = "llama3"
system_prompt = "Reply in concise bullets. Use short sentences. Break lines for each bullet. Be direct."
llm_timeout_secs = 45
cmd_timeout_secs = 60
max_context_tokens = 4096
streaming = true
request_timeout_secs = 60

# Optional: set a custom history file path
# history_path = "/path/to/history.jsonl"
