[package]
name = "llm_cli"
version = "0.1.0"
edition = "2024"
description = "A local Ollama-powered terminal assistant with safe developer workflows"
readme = "README.md"
repository = "https://github.com/YingxuanHu/Rust-CLI"
keywords = ["cli", "ollama", "tui", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
ratatui = "0.27"
crossterm = "0.27"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "fs"] }
strsim = "0.11"
fuzzy-matcher = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.dev]
incremental = false
